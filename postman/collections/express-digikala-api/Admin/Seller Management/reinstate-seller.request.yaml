$kind: http-request
name: Reinstate Seller
method: POST
url: '{{base_url}}/api/v1/admin/sellers/{{seller_id}}/reinstate'
order: 6000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{admin_token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "reason": "بررسی مدارک اصالت کالا و برطرف شدن ابهامات"
    }
