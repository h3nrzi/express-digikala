$kind: http-request
name: Verify MFA
method: POST
url: '{{base_url}}/api/v1/admin/auth/mfa/verify'
order: 3000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "sessionToken": "{{session_token}}",
      "code": "123456"
    }
