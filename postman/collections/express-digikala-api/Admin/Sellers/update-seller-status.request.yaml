$kind: http-request
name: Update Seller Status
method: PATCH
url: '{{base_url}}/api/v1/admin/sellers/{{seller_id}}/status'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{admin_token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "under-review",
      "reason": "Documents verified"
    }
