$kind: http-request
name: Add or Update Cart Line
method: PUT
url: '{{base_url}}/api/v1/cart/lines/{{offer_id}}'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{buyer_token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "quantity": 1
    }
