$kind: http-request
name: Invite Operational User
method: POST
url: '{{base_url}}/api/v1/admin/users/invite'
order: 1000
auth:
  type: bearer
  credentials:
    token: '{{admin_token}}'
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "user2@example.com",
      "phone": "09123456781",
      "roles": ["seller-mgmt"],
      "fullName": "New User"
    }
