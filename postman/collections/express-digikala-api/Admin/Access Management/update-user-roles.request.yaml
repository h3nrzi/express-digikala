$kind: http-request
name: Update User Roles
method: POST
url: '{{base_url}}/api/v1/admin/users/{{user_id}}/roles'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{admin_token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "roles": ["seller-mgmt", "catalog"]
    }
